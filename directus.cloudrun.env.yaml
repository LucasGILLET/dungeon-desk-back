# Variables (non secrètes) du Directus de production sur Cloud Run :
#   gcloud run deploy dungeon-desk-directus --env-vars-file directus.cloudrun.env.yaml …
# Les secrets (SECRET, ADMIN_PASSWORD, ADMIN_TOKEN, LICENSE_KEY, DB_CONNECTION_STRING)
# viennent de Secret Manager (--set-secrets), voir docs/manuel-deploiement.md du front.

# Adresse définitive : la licence (Open Innovation Grant) est liée à cette adresse,
# chaque nouvelle adresse consomme une activation (5 au total).
PUBLIC_URL: https://dungeon-desk-directus-657109760065.europe-west9.run.app
TELEMETRY: "false"

# Base Neon de prod, point d'accès direct (sans -pooler) : le pooler de Neon
# (mode transaction) ne garde pas le search_path entre deux requêtes.
DB_CLIENT: pg
# Tables système (directus_*) dans le schéma `directus`, à créer avant le premier
# démarrage ; les tables du socle restent dans `public`, gérées par Prisma.
DB_SEARCH_PATH: directus,public
# Pas de connexion gardée ouverte : la base Neon peut se mettre en veille
DB_POOL__MIN: "0"

# Fichiers (images des guides) dans un bucket : le disque de Cloud Run est éphémère.
# Pas de clé : le driver utilise le compte de service du service Cloud Run.
STORAGE_LOCATIONS: gcs
STORAGE_GCS_DRIVER: gcs
STORAGE_GCS_BUCKET: dungeon-desk-directus-files

# Aperçu des pages de documentation : le front doit pouvoir s'afficher dans le cadre d'aperçu
CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC: "array:'self',https://www.dungeon-desk.com"
